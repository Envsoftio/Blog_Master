name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy after the build finishes
        type: boolean
        default: true
      goarch:
        description: VPS CPU architecture for Go binaries
        type: choice
        default: amd64
        options:
          - amd64
          - arm64

concurrency:
  group: seoblog-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '11.17.0'

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    outputs:
      goarch: ${{ steps.target.outputs.goarch }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select target architecture
        id: target
        shell: bash
        env:
          INPUT_GOARCH: ${{ github.event.inputs.goarch }}
          SECRET_GOARCH: ${{ secrets.VPS_GOARCH }}
        run: |
          goarch="${INPUT_GOARCH:-${SECRET_GOARCH:-amd64}}"
          case "$goarch" in
            amd64|arm64) ;;
            *) echo "Unsupported GOARCH: $goarch" >&2; exit 1 ;;
          esac
          echo "goarch=$goarch" >> "$GITHUB_OUTPUT"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/backend/go.mod
          cache-dependency-path: apps/backend/go.sum

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate

      - name: Locate pnpm store
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test backend
        working-directory: apps/backend
        run: go test ./...

      - name: Validate backup and restore automation
        run: infra/backup/tests/run.sh

      - name: Validate observability contracts
        run: infra/observability/tests/run.sh

      - name: Verify generated OpenAPI contract
        working-directory: apps/backend
        run: |
          go run ./cmd/admincli openapi
          git diff --exit-code -- ../../contracts/openapi/openapi.yaml

      - name: Build content client
        run: pnpm --filter @seoblog/content-client build

      - name: Typecheck admin
        run: pnpm --filter @seoblog/admin typecheck

      - name: Build admin
        run: pnpm --filter @seoblog/admin build

      - name: Package release
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          TARGET_GOARCH: ${{ steps.target.outputs.goarch }}
        run: |
          release_id="${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:12}"
          rm -rf .deploy-artifact seoblog-release.tar.gz
          mkdir -p \
            .deploy-artifact/admin \
            .deploy-artifact/backend \
            .deploy-artifact/contracts/openapi \
            .deploy-artifact/packages/content-client \
            .deploy-artifact/scripts

          cp -R apps/admin/.output .deploy-artifact/admin/.output
          cp infra/pm2/ecosystem.config.cjs .deploy-artifact/ecosystem.config.cjs
          cp contracts/openapi/openapi.yaml .deploy-artifact/contracts/openapi/openapi.yaml
          cp packages/content-client/package.json .deploy-artifact/packages/content-client/package.json
          cp -R packages/content-client/dist .deploy-artifact/packages/content-client/dist
          cp scripts/release-manifest.mjs .deploy-artifact/scripts/release-manifest.mjs
          printf '%s\n' "$GITHUB_SHA" > .deploy-artifact/REVISION

          (
            cd apps/backend
            CGO_ENABLED=0 GOOS=linux GOARCH="$TARGET_GOARCH" go build -trimpath -ldflags="-s -w" -o ../../.deploy-artifact/backend/api ./cmd/api
            CGO_ENABLED=0 GOOS=linux GOARCH="$TARGET_GOARCH" go build -trimpath -ldflags="-s -w" -o ../../.deploy-artifact/backend/worker ./cmd/worker
            CGO_ENABLED=0 GOOS=linux GOARCH="$TARGET_GOARCH" go build -trimpath -ldflags="-s -w" -o ../../.deploy-artifact/backend/admincli ./cmd/admincli
          )

          RELEASE_ID="$release_id" TARGET_GOARCH="$TARGET_GOARCH" node scripts/release-manifest.mjs generate .deploy-artifact
          node scripts/release-manifest.mjs verify .deploy-artifact "$release_id"
          tar -C .deploy-artifact -czf seoblog-release.tar.gz .

      - name: Upload release artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: seoblog-release
          path: seoblog-release.tar.gz
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy to VPS
    needs: build
    runs-on: ubuntu-latest
    if: >
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy)
    environment: production
    steps:
      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: seoblog-release

      - name: Deploy over SSH
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          missing=0
          for name in VPS_HOST VPS_USER VPS_SSH_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "Missing GitHub secret: $name" >&2
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

          port="${VPS_SSH_PORT:-22}"
          deploy_path="${VPS_DEPLOY_PATH:-/srv/seoblog}"
          key_file="${RUNNER_TEMP}/vps_key"
          remote_archive="/tmp/seoblog-release-${GITHUB_SHA}.tar.gz"
          remote_script="${deploy_path%/}/deploy.sh"
          release_id="${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:12}"

          quote() {
            printf "'%s'" "$(printf '%s' "$1" | sed "s/'/'\\\\''/g")"
          }

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$key_file"
          chmod 600 "$key_file"

          if [ -n "${VPS_SSH_KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" >> "$HOME/.ssh/known_hosts"
          else
            ssh-keyscan -p "$port" "$VPS_HOST" >> "$HOME/.ssh/known_hosts" 2>/dev/null
          fi
          chmod 600 "$HOME/.ssh/known_hosts"

          scp -P "$port" -i "$key_file" seoblog-release.tar.gz "${VPS_USER}@${VPS_HOST}:${remote_archive}"
          ssh -p "$port" -i "$key_file" "${VPS_USER}@${VPS_HOST}" \
            "DEPLOY_PATH=$(quote "$deploy_path") RELEASE=$(quote "$release_id") RELEASE_SHA=$(quote "$GITHUB_SHA") $(quote "$remote_script") $(quote "$remote_archive")"
