    CopyArticleRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/CopyArticleRequest.json
          format: uri
          readOnly: true
          type: string
        canonicalDecision:
          description: Use the source article's canonical URL, or create a destination-owned material adaptation.
          enum:
            - canonical_original
            - material_adaptation
          type: string
        canonicalOriginalUrl:
          description: Optional assertion for canonical_original. When supplied, it must match the source article's canonical URL; the server always derives the stored canonical from the source publication.
          format: uri
          type: string
        contributorMappings:
          items:
            $ref: "#/components/schemas/CopyContributorMappingRequest"
          type:
            - array
            - "null"
        destinationProjectId:
          type: string
        primaryCategoryId:
          type: string
        slug:
          type: string
      required:
        - destinationProjectId
        - primaryCategoryId
        - slug
        - canonicalDecision
        - contributorMappings
      type: object
    CopyContributorMappingRequest:
      additionalProperties: false
      properties:
        destinationAuthorId:
          type: string
        sourceAuthorId:
          type: string
      required:
        - sourceAuthorId
        - destinationAuthorId
      type: object
