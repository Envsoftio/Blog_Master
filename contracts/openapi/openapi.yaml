        html:
          type: string
        openGraphDescription:
          type: string
        openGraphImage:
          type: string
        openGraphTitle:
          type: string
        primaryCategoryId:
          type: string
        robots:
          type: string
        seoDescription:
          type: string
        seoTitle:
          type: string
        shortAnswer:
          type: string
        tagIds:
          items:
            type: string
          type:
            - array
            - "null"
        title:
          type: string
