        - articleId
        - userId
        - baseRevisionId
        - version
        - draft
        - stale
        - createdAt
        - updatedAt
      type: object
    ArticleAutosaveDraft:
      additionalProperties: false
      properties:
        attributionEdited:
          type: boolean
        bodyDocument: {}
        contributors:
          items:
            $ref: "#/components/schemas/RevisionContributorInput"
          type:
            - array
            - "null"
        deck:
          type: string
        excerpt:
          type: string
        html:
          type: string
        openGraphDescription:
          type: string
        openGraphImage:
          type: string
        openGraphTitle:
          type: string
        primaryCategoryId:
          type: string
        robots:
          type: string
        seoDescription:
          type: string
        seoTitle:
          type: string
        shortAnswer:
          type: string
        title:
          type: string
      required:
        - title
        - primaryCategoryId
        - contributors
        - attributionEdited
        - deck
        - excerpt
        - shortAnswer
        - seoTitle
        - seoDescription
        - robots
        - openGraphTitle
        - openGraphDescription
        - openGraphImage
        - html
      type: object
    ArticleAutosaveRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ArticleAutosaveRequest.json
          format: uri
          readOnly: true
          type: string
        baseRevisionId:
          type: string
        draft:
          $ref: "#/components/schemas/ArticleAutosaveDraft"
        expectedVersion:
          format: int64
          type: integer
      required:
        - baseRevisionId
        - expectedVersion
        - draft
      type: object
    CopyArticleRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/CopyArticleRequest.json
          format: uri
          readOnly: true
          type: string
        canonicalDecision:
          description: Use the selected source revision's canonical URL, or create a destination-owned material adaptation.
          enum:
            - canonical_original
            - material_adaptation
          type: string
        canonicalOriginalUrl:
          description: Optional assertion for canonical_original. When supplied, it must match the selected source revision's source canonical URL; the server always derives the stored canonical from the source publication.
          format: uri
          type: string
        contributorMappings:
          items:
            $ref: "#/components/schemas/CopyContributorMappingRequest"
          type:
            - array
            - "null"
        destinationProjectId:
          type: string
        primaryCategoryId:
          type: string
        slug:
          type: string
        sourceRevisionId:
          type: string
      required:
        - destinationProjectId
        - sourceRevisionId
        - primaryCategoryId
        - slug
        - canonicalDecision
        - contributorMappings
      type: object
    CopyContributorMappingRequest:
      additionalProperties: false
      properties:
        destinationAuthorId:
          type: string
        sourceAuthorId:
          type: string
      required:
        - sourceAuthorId
        - destinationAuthorId
      type: object
    EnvelopeAdminArticle:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/EnvelopeAdminArticle.json
          format: uri
          readOnly: true
          type: string
        data:
          $ref: "#/components/schemas/AdminArticle"
        meta:
          $ref: "#/components/schemas/MetaData"
      required:
        - data
      type: object
    EnvelopeAdminRevision:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/EnvelopeAdminRevision.json
          format: uri
          readOnly: true
          type: string
        data:
          $ref: "#/components/schemas/AdminRevision"
        meta:
