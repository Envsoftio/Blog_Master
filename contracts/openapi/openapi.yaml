        - role
        - position
      type: object
    RevisionContributorRequest:
      additionalProperties: false
      properties:
        authorId:
          type: string
        position:
          format: int64
          type: integer
        role:
          type: string
      required:
        - authorId
        - role
        - position
      type: object
    RevisionRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/RevisionRequest.json
          format: uri
          readOnly: true
          type: string
        baseRevisionId:
          type: string
        bodyDocument: {}
        contributors:
          items:
            $ref: "#/components/schemas/RevisionContributorRequest"
          type:
            - array
            - "null"
        deck:
          type: string
        excerpt:
          type: string
        html:
          type: string
        primaryCategoryId:
          type: string
        seo:
          $ref: "#/components/schemas/SeoRequest"
        shortAnswer:
          type: string
        title:
          type: string
      required:
        - baseRevisionId
        - title
      type: object
    RollbackRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/RollbackRequest.json
          format: uri
          readOnly: true
          type: string
        revisionId:
          type: string
      required:
        - revisionId
      type: object
    SeoRequest:
      additionalProperties: false
      properties:
        description:
          type: string
        openGraphDescription:
          type: string
        openGraphImage:
          type: string
        openGraphTitle:
          type: string
        robots:
          type: string
        title:
          type: string
      required:
        - title
        - description
        - robots
        - openGraphTitle
        - openGraphDescription
        - openGraphImage
      type: object
  securitySchemes:
    adminSession:
      description: Administrative session cookie issued by the login endpoint.
      in: cookie
      name: seoblog_session
      type: apiKey
