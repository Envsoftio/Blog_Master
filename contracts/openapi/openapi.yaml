        - id
        - projectId
        - articleType
        - slug
        - title
        - publicationState
        - canonicalPolicy
        - createdAt
      type: object
    AdminRevision:
      additionalProperties: false
      properties:
        articleId:
          type: string
        contentHash:
          type: string
        createdAt:
          type: string
        deck:
          type: string
        excerpt:
          type: string
        id:
          type: string
        projectId:
          type: string
        revisionNumber:
          format: int64
          type: integer
        shortAnswer:
          type: string
        title:
          type: string
      required:
        - id
        - projectId
        - articleId
        - revisionNumber
        - title
        - contentHash
        - createdAt
      type: object
    ApiKeyRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ApiKeyRequest.json
          format: uri
          readOnly: true
          type: string
        environment:
          enum:
            - production
            - staging
            - development
            - preview
          type: string
        expiresAt:
          type: string
        name:
          maxLength: 100
          minLength: 1
          type: string
        scopes:
          items:
            enum:
              - content:published:read
              - taxonomy:published:read
              - authors:published:read
