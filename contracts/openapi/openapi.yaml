      additionalProperties: false
      properties:
        contentGeneration:
          format: int64
          type: integer
        etag:
          type: string
        projectId:
          type: string
      type: object
    PageMeta:
      additionalProperties: false
      properties:
        contentGeneration:
          format: int64
          type: integer
        limit:
          format: int64
          type: integer
        nextCursor:
          type: string
        openCount:
          format: int64
          type: integer
        projectId:
          type: string
      required:
        - limit
      type: object
    PasswordResetResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/PasswordResetResponse.json
          format: uri
          readOnly: true
          type: string
        data:
          additionalProperties: {}
          type: object
      required:
        - data
      type: object
    Problem:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/Problem.json
          format: uri
          readOnly: true
          type: string
        detail:
          type: string
        status:
          format: int64
          type: integer
        title:
          type: string
        type:
          type: string
      required:
        - type
        - title
        - status
      type: object
    ResetPasswordRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ResetPasswordRequest.json
          format: uri
          readOnly: true
          type: string
        password:
          maxLength: 128
          minLength: 15
          type: string
        token:
          minLength: 1
          type: string
      required:
        - token
        - password
      type: object
    RevisionContributorInput:
      additionalProperties: false
      properties:
        authorId:
          type: string
        position:
          format: int64
          type: integer
        role:
          type: string
      required:
