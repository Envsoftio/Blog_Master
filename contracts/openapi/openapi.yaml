      summary: POST /api/v1/auth/reauthenticate
      tags:
        - Authentication
  /api/v1/auth/reset-password:
    post:
      description: Consumes an unexpired one-time reset token, changes the password and revokes every active session for the account.
      operationId: completePasswordReset
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
        description: One-time reset token and replacement password.
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordResetResponse"
          description: Password reset completed
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Invalid request, password or reset token
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Password-reset rate limit exceeded
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal server error
      summary: Complete a password reset
      tags:
        - Authentication
  /api/v1/invitations/{token}/accept:
