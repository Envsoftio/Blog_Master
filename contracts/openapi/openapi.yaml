          type: string
      required:
        - key
        - secret
      type: object
    AdminAPIKey:
      additionalProperties: false
      properties:
        createdAt:
          type: string
        createdBy:
          type: string
        environment:
          enum:
            - production
            - staging
            - development
            - preview
          type: string
        expiresAt:
          type: string
        id:
          type: string
        lastUsedAt:
          type: string
        name:
          type: string
        projectId:
          type: string
        revokedAt:
          type: string
        scopes:
          items:
            type: string
          type:
            - array
            - "null"
        status:
          enum:
            - active
            - expired
            - revoked
          type: string
        tokenPrefix:
          type: string
      required:
        - id
        - projectId
        - environment
        - name
        - tokenPrefix
        - scopes
        - createdBy
        - createdAt
        - status
      type: object
    AdminArticle:
      additionalProperties: false
      properties:
        archivedAt:
          type: string
        articleType:
          type: string
        bodyDocument: {}
        canonicalPolicy:
          type: string
        canonicalUrl:
          type: string
        contributors:
