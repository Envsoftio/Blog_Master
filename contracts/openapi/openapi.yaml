        id:
          type: string
        indexable:
          type: boolean
        name:
          type: string
        parentId:
          type: string
        slug:
          type: string
        type:
          type: string
      required:
        - id
        - type
        - slug
        - name
        - indexable
      type: object
  securitySchemes:
    adminSession:
      description: Administrative session cookie issued by the login endpoint.
      in: cookie
      name: seoblog_session
