        - primaryCategoryId
        - tagIds
        - contributors
        - attributionEdited
        - deck
        - excerpt
        - shortAnswer
        - seoTitle
        - seoDescription
        - robots
        - openGraphTitle
        - openGraphDescription
        - openGraphImage
        - html
      type: object
    ArticleAutosaveRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ArticleAutosaveRequest.json
