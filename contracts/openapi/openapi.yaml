  /api/v1/auth/csrf:
    get:
      description: Administrative API route.
      operationId: get_api_v1_auth_csrf
      responses:
        "200":
          description: Successful response
        "400":
          description: Invalid request
        "401":
          description: Authentication required
        "403":
          description: Insufficient permission
        "404":
          description: Resource not found
        "500":
          description: Internal server error
      summary: GET /api/v1/auth/csrf
      tags:
        - Authentication
    head:
      description: Administrative API route.
      operationId: head_api_v1_auth_csrf
      responses:
        "200":
          description: Successful response without a body
        "400":
          description: Invalid request
        "401":
          description: Authentication required
        "403":
          description: Insufficient permission
        "404":
          description: Resource not found
        "500":
          description: Internal server error
      summary: HEAD /api/v1/auth/csrf
      tags:
        - Authentication
  /api/v1/auth/forgot-password:
    post:
      description: Creates a one-time reset token for an active account and sends it by email. The response is identical when the address is unknown.
      operationId: requestPasswordReset
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
        description: Account email address.
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordResetResponse"
          description: Password-reset request accepted
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Invalid request body
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Password-reset rate limit exceeded
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal server error
      summary: Request a password reset
      tags:
        - Authentication
  /api/v1/auth/login:
    post:
      description: Administrative API route.
      operationId: post_api_v1_auth_login
      responses:
