  /api/v1/projects/{projectID}/articles:
    get:
      description: Returns a project-scoped, cursor-paginated article list with allowlisted server-side filters.
      operationId: listAdminArticles
      parameters:
        - description: Project identifier
          in: path
          name: projectID
          required: true
          schema:
            type: string
        - description: Opaque article-list cursor
          in: query
          name: cursor
          schema:
            type: string
        - description: Page size, up to 100
          in: query
          name: limit
          schema:
            maximum: 100
            minimum: 1
            type: integer
        - description: Case-insensitive title, slug, or article-type search; wildcard characters are treated literally
          in: query
          name: q
          schema:
            maxLength: 100
            type: string
        - description: Exact latest-revision editorial state
          in: query
          name: editorialState
          schema:
            enum:
              - draft
              - in_review
              - changes_requested
              - approved
            type: string
        - description: Exact publication state; archived automatically includes archived records
          in: query
          name: publicationState
          schema:
            enum:
              - unpublished
              - scheduled
              - published
              - archived
            type: string
        - description: Include archived articles alongside active records
          in: query
          name: includeArchived
          schema:
            type: boolean
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeAdminArticle"
          description: Article page
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Invalid filter or pagination input
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Authentication required
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Insufficient permission
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Project not found
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal server error
      security:
        - adminSession: []
      summary: List project articles
      tags:
        - Administration
    head:
      operationId: headAdminArticles
      parameters:
        - description: Project identifier
          in: path
          name: projectID
          required: true
          schema:
            type: string
        - description: Opaque article-list cursor
          in: query
          name: cursor
          schema:
            type: string
        - description: Page size, up to 100
          in: query
          name: limit
          schema:
            maximum: 100
            minimum: 1
            type: integer
        - description: Case-insensitive title, slug, or article-type search; wildcard characters are treated literally
          in: query
          name: q
          schema:
            maxLength: 100
            type: string
        - description: Exact latest-revision editorial state
          in: query
          name: editorialState
          schema:
            enum:
              - draft
              - in_review
              - changes_requested
              - approved
            type: string
        - description: Exact publication state; archived automatically includes archived records
          in: query
          name: publicationState
          schema:
            enum:
              - unpublished
              - scheduled
              - published
              - archived
            type: string
        - description: Include archived articles alongside active records
          in: query
          name: includeArchived
          schema:
            type: boolean
      responses:
        "200":
          description: The article list is available
