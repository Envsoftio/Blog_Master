          type:
            - array
            - "null"
        createdAt:
          type: string
        deck:
          type: string
        excerpt:
          type: string
        html:
          type: string
        id:
          type: string
        latestRevision:
          $ref: "#/components/schemas/AdminRevision"
        originArticleId:
