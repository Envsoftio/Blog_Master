        originProjectId:
          type: string
        primaryCategoryId:
          type: string
        projectId:
          type: string
        publicationState:
          type: string
        publishedAt:
          type: string
        scheduledForUtc:
          type: string
        seo:
          $ref: "#/components/schemas/SEOInput"
        shortAnswer:
          type: string
        slug:
          type: string
        tagIds:
          items:
            type: string
          type:
            - array
            - "null"
        tags:
          items:
            $ref: "#/components/schemas/TaxonomyTerm"
          type:
            - array
            - "null"
        title:
          type: string
