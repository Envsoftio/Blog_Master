      type: object
    EnvelopeAdminRevisionDetail:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/EnvelopeAdminRevisionDetail.json
          format: uri
          readOnly: true
          type: string
        data:
          $ref: "#/components/schemas/AdminRevisionDetail"
        meta:
          $ref: "#/components/schemas/MetaData"
      required:
